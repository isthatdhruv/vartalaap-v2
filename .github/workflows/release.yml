name: Release

# Builds installers for every platform:
#   - Linux:   .deb + .AppImage      (ubuntu runner)
#   - Windows: .exe (NSIS installer)  (windows runner)
#
# Trigger manually (Actions tab → Run workflow) to get downloadable artifacts,
# or push a tag like `v0.1.0` to also attach them to a draft GitHub Release.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: "--bundles deb,appimage"
          - platform: windows-latest
            args: "--bundles nsis"
          - platform: macos-13 # Intel Macs
            args: "--bundles dmg"
          - platform: macos-14 # Apple Silicon Macs
            args: "--bundles dmg"
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libxdo-dev libssl-dev build-essential

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build the app (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Vartalaap ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vartalaap-${{ matrix.platform }}
          if-no-files-found: ignore
          path: |
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/dmg/*.dmg

  # Flatpak — the build that also runs on PRE-2022 Linux (Ubuntu 18.04/20.04,
  # Debian 11), where webkit2gtk-4.1 isn't available natively. The GNOME runtime
  # provides it inside the sandbox.
  flatpak:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build + flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libxdo-dev libssl-dev build-essential flatpak flatpak-builder

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the .deb (on 22.04, for glibc 2.35)
        working-directory: app
        run: |
          npm ci
          npm run tauri build -- --bundles deb

      - name: Stage the .deb for the Flatpak manifest
        run: cp app/src-tauri/target/release/bundle/deb/*.deb packaging/flatpak/vartalaap.deb

      - name: Install GNOME runtime
        run: |
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//47 org.gnome.Sdk//47

      - name: Build the Flatpak bundle
        run: |
          flatpak-builder --user --force-clean --repo=fp-repo fp-build \
            packaging/flatpak/com.vartalaap.app.yml
          flatpak build-bundle --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            fp-repo Vartalaap.flatpak com.vartalaap.app

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: vartalaap-flatpak
          path: Vartalaap.flatpak
          if-no-files-found: ignore
