name: Release

# Builds every installer, plus SHA256SUMS:
#   - Linux:   .deb + .AppImage (ubuntu-22.04, for the glibc floor)
#   - Linux:   .flatpak         (also runs on pre-2022 distros)
#   - Windows: .exe             (NSIS installer)
#   - macOS:   .dmg             (universal — Intel + Apple Silicon)
#
# Trigger manually (Actions tab → Run workflow) for downloadable artifacts, or
# push a `v*` tag to publish them as a GitHub Release.
#
# Code signing is opt-in and driven entirely by repository secrets; with none
# set, macOS is ad-hoc signed (free, and required for Apple Silicon to run it
# at all) and Windows is unsigned. See the "Code signing" section of README.md.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on 22.04 on purpose: it sets the glibc floor for the .deb and
          # .AppImage, so they still start on Ubuntu 22.04 / Debian 12.
          - platform: ubuntu-22.04
            args: "--bundles deb,appimage"
            targets: ""
          - platform: windows-latest
            args: "--bundles nsis"
            targets: ""
          # One universal .dmg covering Intel and Apple Silicon, rather than a
          # per-architecture runner each. Same thing scripts/build-macos.sh
          # produces, and it does not depend on the retired Intel runner image.
          - platform: macos-14
            args: "--target universal-apple-darwin --bundles dmg"
            targets: "x86_64-apple-darwin,aarch64-apple-darwin"
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # Kept in step with packaging/Dockerfile.ubuntu2204, which is the other
      # place these are pinned. Note libayatana-appindicator3-dev, not
      # libappindicator3-dev: the latter is a transitional package that no
      # longer resolves on 22.04, and apt failing here kills the whole leg.
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libxdo-dev libssl-dev build-essential

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # Windows signing is opt-in and entirely secret-driven: with no
      # certificate configured this writes nothing and the build proceeds
      # exactly as it does today, unsigned. Kept out of tauri.conf.json
      # deliberately — a thumbprint hardcoded there fails every build on every
      # machine that does not hold that certificate, including local ones.
      - name: Configure Windows code signing
        id: winsign
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          CERT: ${{ secrets.WINDOWS_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          if [ -z "$THUMBPRINT" ]; then
            echo "::notice::No Windows signing certificate configured — the .exe will be unsigned."
            echo "args=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$CERT" ]; then
            echo "$CERT" | base64 --decode > cert.pfx
            powershell -Command "Import-PfxCertificate -FilePath cert.pfx \
              -CertStoreLocation Cert:\\CurrentUser\\My \
              -Password (ConvertTo-SecureString -String '$CERT_PASSWORD' -Force -AsPlainText)"
            rm -f cert.pfx
          fi
          cat > app/src-tauri/signing.conf.json <<JSON
          {
            "bundle": {
              "windows": {
                "certificateThumbprint": "$THUMBPRINT",
                "digestAlgorithm": "sha256",
                "timestampUrl": "http://timestamp.digicert.com"
              }
            }
          }
          JSON
          echo "args=--config signing.conf.json" >> "$GITHUB_OUTPUT"

      - name: Build the app (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # AppImage's tooling mounts itself with FUSE, which CI runners do not
          # provide; without this it fails, and since the .deb and .AppImage
          # are one tauri invocation, it would take the .deb down with it.
          # Same two settings packaging/Dockerfile.ubuntu2204 needs.
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: true

          # --- macOS code signing -------------------------------------------
          # Falls back to "-", which is codesign's ad-hoc identity: no
          # certificate, no cost, no Apple account. That is not cosmetic on
          # Apple Silicon, where the kernel refuses to execute a binary
          # carrying no signature at all — an unsigned build is reported to
          # the user as *damaged*, offering only "Move to Trash", which reads
          # as "this download is malware" rather than "this developer has not
          # paid Apple". Ad-hoc signing turns that into the ordinary
          # unidentified-developer prompt they can click past.
          #
          # It is NOT notarization: Gatekeeper still warns. Set the secrets
          # below to sign for real, and the same build notarizes too.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          # All inert while unset — tauri-action skips the keychain import and
          # the notarization step when these are empty.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: app
          args: ${{ matrix.args }} ${{ steps.winsign.outputs.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Vartalaap ${{ github.ref_name }}"
          # Published, not drafted: a tag is the decision to ship, and a draft
          # is invisible to everyone but the repo owner — which reads as "the
          # release has no downloads". Note the release therefore appears as
          # soon as the first platform finishes and fills in over the next few
          # minutes as the rest land.
          releaseDraft: false
          prerelease: false

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vartalaap-${{ matrix.platform }}
          if-no-files-found: ignore
          # The macOS leg builds for an explicit target triple, so its bundle
          # lands under target/<triple>/release rather than target/release.
          path: |
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  # Flatpak — the build that also runs on PRE-2022 Linux (Ubuntu 18.04/20.04,
  # Debian 11), where webkit2gtk-4.1 isn't available natively. The GNOME runtime
  # provides it inside the sandbox.
  flatpak:
    # 24.04, not 22.04, and the reason is specific: flatpak-builder 1.2 (what
    # 22.04 ships) invokes `appstream-compose` inside the SDK to process the
    # metainfo. AppStream 1.0 replaced that binary with `appstreamcli compose`,
    # so it no longer exists in the GNOME 47 runtime and the build died with
    # "bwrap: execvp appstream-compose: No such file or directory".
    # flatpak-builder 1.4 on 24.04 calls the new one.
    #
    # The binary inside the bundle is still the one built on 22.04 — it is
    # downloaded from the `build` job rather than recompiled here, which keeps
    # the glibc floor *and* saves six minutes of duplicate work.
    runs-on: ubuntu-24.04
    # Also orders us after the draft release exists, for the upload below.
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Fetch the .deb built on 22.04
        uses: actions/download-artifact@v4
        with:
          name: vartalaap-ubuntu-22.04
          path: linux-bundles

      - name: Stage the .deb for the Flatpak manifest
        run: |
          deb="$(find linux-bundles -name '*.deb' | head -1)"
          test -n "$deb" || { echo "no .deb in the build artifact"; exit 1; }
          echo "using $deb"
          cp "$deb" packaging/flatpak/vartalaap.deb

      - name: Install GNOME runtime
        run: |
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//47 org.gnome.Sdk//47

      - name: Build the Flatpak bundle
        run: |
          flatpak-builder --user --force-clean --repo=fp-repo fp-build \
            packaging/flatpak/com.vartalaap.app.yml
          flatpak build-bundle --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            fp-repo Vartalaap.flatpak com.vartalaap.app

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: vartalaap-flatpak
          path: Vartalaap.flatpak
          if-no-files-found: ignore

      # tauri-action attaches the other five installers to the release itself;
      # the Flatpak is built outside it, so without this it would exist only as
      # a workflow artifact — while the README sends people to the Releases
      # page for it. That is the one download old-Linux users need.
      - name: Attach the Flatpak to the release
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" Vartalaap.flatpak --clobber

  # Publish SHA-256 sums alongside the installers.
  #
  # Without a paid certificate the OS cannot vouch for these downloads, but a
  # published checksum still lets anyone confirm the file they got is byte-for-
  # byte the one this workflow built. Verify with:
  #   sha256sum -c SHA256SUMS --ignore-missing     (Linux)
  #   shasum -a 256 -c SHA256SUMS --ignore-missing (macOS)
  checksums:
    needs: [build, flatpak]
    # `always()` so a failed Flatpak leg still gets sums for everything else;
    # gated on the build itself having produced something to hash.
    if: always() && github.ref_type == 'tag' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect every installer
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compute SHA256SUMS
        run: |
          cd artifacts
          find . -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.exe' \
            -o -name '*.dmg' -o -name '*.flatpak' \) -print0 |
          while IFS= read -r -d '' f; do
            # Basename only: the artifact directory layout is an artifact of
            # CI, not something a user downloading from the release sees.
            printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(basename "$f")"
          done | sort -k2 > ../SHA256SUMS
          cd ..
          test -s SHA256SUMS || { echo "no installers found to hash"; exit 1; }
          cat SHA256SUMS

      - name: Attach to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" SHA256SUMS --clobber
